services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_MODE: distributed
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://frio:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/frioalerta
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Configure ADMIN_TOKEN}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:?Configure INTEGRATION_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frioalerta
      POSTGRES_USER: frio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frio -d frioalerta"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
